<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 810" role="img" aria-labelledby="title desc" style="max-width:100%;height:auto">
<title id="title">Country drop dates: Canada 3 November, Australia 5 November, United States 10 November 2026</title>
<desc id="desc">Three launch points share a horizontal November 2026 date axis from 1 to 14 November. Canada 3 November and Australia 5 November are dates reported by PokéBeach after store checks. The United States 10 November date is official from McDonald’s. Checked 4 November 2026. Points indicate launch days, not promotion durations or guaranteed stock.</desc>
<metadata>Original editable BuyTrigger.Cards data graphic. Input: ../country-drop-dates-v2.csv. Target first publication: 2026-11-05; not a publication receipt. Evidence checked 2026-11-04. Date axis origin 1 November 2026, end 14 November; shared scale x=60+(day-1)*40. Original date reporting: https://www.pokebeach.com/2026/10/mcdonalds-pokemon-tcg-promotion-starts-november-10th-features-mini-happy-meal-box-toys-and-15-cards . Official USA confirmation: https://corporate.mcdonalds.com/corpmcd/our-stories/article/USmenuspotter.html . No remote media used or edited.</metadata>
