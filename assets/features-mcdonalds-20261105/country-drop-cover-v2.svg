<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Pokémon Happy Meal country drop dates: Canada 3 November, Australia 5 November, United States 10 November</title>
<desc id="desc">Original BuyTrigger.Cards date graphic. Three large calendar panels show Canada 3 November and Australia 5 November as reported dates from PokéBeach, and United States 10 November as an official date from McDonald’s. All dates are in November 2026.</desc>
<metadata>Original editable BuyTrigger.Cards Feature hero and 16:9 thumbnail. No remote image used or edited. Date inputs: ../country-drop-dates-v2.csv. Evidence checked 2026-11-04. Planned first publication 2026-11-05; not a publication receipt. Canada 2026-11-03 and Australia 2026-11-05: original PokéBeach multiple-store reporting, https://www.pokebeach.com/2026/10/mcdonalds-pokemon-tcg-promotion-starts-november-10th-features-mini-happy-meal-box-toys-and-15-cards . United States 2026-11-10: official McDonald’s, https://corporate.mcdonalds.com/corpmcd/our-stories/article/USmenuspotter.html .</metadata>
