<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 720" role="img" aria-labelledby="title desc" style="max-width:100%;height:auto">
<title id="title">McDonald’s Pokémon launch waves: 7 markets in November, 36 in December, 21 in January, 2 in February</title>
<desc id="desc">The current official schedule, checked 4 November 2026, lists 66 markets across four months. November 2026: 7; December 2026: 36; January 2027: 21; February 2027: 2, Ireland and the United Kingdom. Bar lengths use a shared zero baseline. These are month-level launch announcements, not a count of restaurants or a guarantee of stock.</desc>
<metadata>Original BuyTrigger.Cards data graphic. Inputs: ../release-calendar.json and ../release-calendar.csv. Official source: https://www.pokemon.com/us/news/pokemon-happy-meals-are-coming-to-mcdonalds-in-an-exciting-new-way-. Checked 2026-11-04. Units: markets listed.</metadata>
