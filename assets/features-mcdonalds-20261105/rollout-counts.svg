<g aria-label="December 2026: 36 markets"><text x="28" y="269" font-size="27" font-weight="600">December 2026</text><text x="610" y="269" text-anchor="end" font-size="32" font-weight="700">36</text><rect x="28" y="289" width="510" height="26" fill="#E9E5DD"/><rect x="28" y="289" width="510.0" height="26" fill="#DF242B"/></g>
